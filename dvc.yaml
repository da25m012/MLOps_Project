# dvc.yaml — DVC Pipeline DAG
# Defines reproducible pipeline stages.
# Run with: dvc repro
# Visualise with: dvc dag

stages:

  collect:
    cmd: python scripts/metric_collector.py --one-shot --output data/raw/latest.parquet
    deps:
      - scripts/metric_collector.py
    outs:
      - data/raw/latest.parquet

  validate:
    cmd: python scripts/validate_data.py --input data/raw/latest.parquet
    deps:
      - scripts/validate_data.py
      - data/raw/latest.parquet
    metrics:
      - data/processed/validation_report.json:
          cache: false

  preprocess:
    cmd: python scripts/preprocess.py
           --input data/raw/latest.parquet
           --output data/features/windows_latest.npz
           --scaler-out data/processed/scaler.joblib
    deps:
      - scripts/preprocess.py
      - data/raw/latest.parquet
    outs:
      - data/features/windows_latest.npz
      - data/processed/scaler.joblib

  compute_baselines:
    cmd: python scripts/compute_baselines.py
           --input data/raw/latest.parquet
           --output data/baselines/current_baseline.json
    deps:
      - scripts/compute_baselines.py
      - data/raw/latest.parquet
    outs:
      - data/baselines/current_baseline.json:
          cache: false

  train:
    cmd: python scripts/train.py
           --features data/features/windows_latest.npz
           --model-out models/trained/lstm_ae_latest.pt
           --mlflow-uri ${MLFLOW_TRACKING_URI}
    deps:
      - scripts/train.py
      - data/features/windows_latest.npz
    outs:
      - models/trained/lstm_ae_latest.pt
    metrics:
      - models/trained/metrics.json:
          cache: false
    params:
      - params.yaml:
          - model.hidden_dim
          - model.latent_dim
          - model.num_layers
          - model.dropout
          - training.epochs
          - training.learning_rate
          - training.batch_size

  evaluate:
    cmd: python scripts/evaluate.py
           --model models/trained/lstm_ae_latest.pt
           --features data/features/windows_latest.npz
           --threshold-out models/trained/threshold.json
    deps:
      - scripts/evaluate.py
      - models/trained/lstm_ae_latest.pt
      - data/features/windows_latest.npz
    outs:
      - models/trained/threshold.json:
          cache: false
    metrics:
      - models/trained/eval_metrics.json:
          cache: false

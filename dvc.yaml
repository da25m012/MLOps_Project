stages:
  preprocess:
    cmd: python ml/preprocess.py
    deps:
      - ml/preprocess.py
      - data/raw/train_FD001.txt
    outs:
      - data/processed/windows.npy
      - data/processed/scaler.joblib
      - data/processed/drift_baseline.json

  train:
    cmd: python ml/train.py
    deps:
      - ml/train.py
      - ml/model.py
      - ml/evaluate.py
      - data/processed/windows.npy
      - data/processed/scaler.joblib
    outs:
      - data/processed/threshold.txt

  evaluate:
    cmd: python ml/evaluate.py
    deps:
      - ml/evaluate.py
      - ml/model.py
      - data/processed/windows.npy
      - data/processed/threshold.txt
    outs:
      - data/processed/eval_report.json

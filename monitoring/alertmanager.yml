global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10m
  repeat_interval: 1h
  receiver: 'log-only'

receivers:
  - name: 'log-only'
    # Alerts are logged by Alertmanager — visible at http://localhost:9093
    # In production, replace with email/slack/pagerduty webhook

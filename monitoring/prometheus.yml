global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Load alert rules
rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI backend instrumentation
  - job_name: anomaly_backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  # Flask frontend instrumentation
  - job_name: anomaly_frontend
    static_configs:
      - targets: ["frontend:5000"]
    metrics_path: /metrics

  # Node exporter for host metrics
  - job_name: node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]

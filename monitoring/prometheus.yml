global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

scrape_configs:
  # Scrape Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape FastAPI backend instrumentation
  # Tracks inference requests, latency, anomaly counts, reconstruction error
  - job_name: anomaly_backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  # Node exporter for host-level system metrics (optional monitoring)
  - job_name: node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]

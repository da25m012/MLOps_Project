global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

scrape_configs:
  # Scrape Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape FastAPI backend instrumentation
  - job_name: anomaly_backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  # Scrape node exporter for host-level CPU / memory
  - job_name: node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]

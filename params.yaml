# params.yaml — tracked by DVC for experiment reproducibility
# Every value here is logged to MLflow automatically via dvc repro

data:
  window_size: 60
  feature_cols:
    - cpu_percent
    - mem_percent
    - disk_io_read_mb
    - disk_io_write_mb
    - net_bytes_sent_mb
    - net_bytes_recv_mb
    - req_rate_per_sec
    - error_rate_percent
  train_split: 0.8
  anomaly_injection_rate: 0.05

model:
  input_dim: 8
  hidden_dim: 64
  latent_dim: 16
  num_layers: 2
  dropout: 0.2

training:
  epochs: 50
  learning_rate: 0.001
  batch_size: 32
  grad_clip_norm: 1.0

evaluation:
  threshold_percentile: 95
  acceptance_val_loss: 0.05
  severity_low_multiplier: 1.5
  severity_medium_multiplier: 2.5
  severity_high_multiplier: 4.0

drift:
  psi_threshold: 0.2
  ks_alpha: 0.05
